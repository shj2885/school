<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중2 정보 형성평가</title>
<meta name="theme-color" content="#12261b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정보 문제">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --jungle:#12261b; --jungle2:#1b3a28; --leaf:#2f6b45; --moss:#8fc26a;
  --amber:#ffb627; --amber-soft:#fff1cf; --paper:#fbf7ec; --ink:#1d2a22;
  --muted:#5d6b62; --line:#e3dccb; --card:#ffffff; --red:#d9483b; --red-soft:#fde5e2; --green-soft:#e4f3da;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;line-height:1.6}
button{font-family:inherit;cursor:pointer;color:inherit}
.jua{font-family:Jua,sans-serif;font-weight:400}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 머리 */
header{background:radial-gradient(circle at 88% 10%,#2f6b45 0,transparent 45%),
  linear-gradient(160deg,var(--jungle),var(--jungle2));color:#fff;padding:16px 16px 18px}
.head-in{max-width:640px;margin:0 auto}
.kicker{color:var(--amber);font-size:14px}
header h1{margin:0;font-size:clamp(22px,6.4vw,32px)}
header p{margin:2px 0 0;color:#cfe3d3;font-size:14px}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}

/* 단원 목록 */
.total{display:flex;gap:10px;margin-bottom:16px}
.total div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.total b{display:block;font-family:Jua,sans-serif;font-weight:400;font-size:26px;color:var(--leaf);line-height:1.2}
.total span{font-size:12.5px;color:var(--muted)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:transform .1s}
.unit:active{transform:scale(.98)}
.unit .no{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--jungle);color:var(--amber);
  display:grid;place-items:center;font-family:Jua,sans-serif;font-size:17px}
.unit .tx{flex:1;min-width:0}
.unit .nm{font-weight:700;font-size:16px}
.unit .meta{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:#efe9da;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.unit .badge{flex:0 0 auto;font-size:22px}
.wrongall{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:16px;font-weight:700;padding:13px;margin:6px 0 4px}
.wrongall:disabled{background:#d8d2c3;color:#8a8577}
.reset{display:block;margin:18px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}

/* 문제 화면 */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{flex:0 0 auto;border:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.qtop .where{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.qtop .cnt{flex:0 0 auto;font-family:Jua,sans-serif;font-size:18px;color:var(--leaf)}
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots i{flex:1;height:7px;border-radius:99px;background:#e6dfcd}
.dots i.ok{background:var(--moss)}
.dots i.no{background:var(--red)}
.dots i.cur{outline:2px solid var(--amber);outline-offset:1px}

.card{background:var(--card);border-radius:22px;padding:20px 18px 18px;
  box-shadow:0 1px 0 var(--line),0 10px 30px rgba(18,38,27,.10);border:1px solid var(--line);
  touch-action:pan-y;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(var(--from,24px))}to{opacity:1;transform:none}}
.qno{display:inline-block;background:var(--amber);color:var(--jungle);border-radius:10px;padding:0 10px;
  font-family:Jua,sans-serif;font-size:17px;margin-bottom:8px}
.q{font-size:18px;font-weight:700;line-height:1.55;margin:0 0 12px;word-break:keep-all}
.box{background:var(--amber-soft);border:1.5px dashed var(--amber);border-radius:12px;padding:10px 12px;
  font-size:15px;margin:0 0 14px;word-break:keep-all}
.box div+div{margin-top:4px}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;
  border:2px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;font-size:16px;line-height:1.45;word-break:keep-all}
.ch .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#efe9da;display:grid;place-items:center;
  font-size:14px;font-weight:700;margin-top:-1px}
.ch:active{transform:scale(.99)}
.ch.right{border-color:var(--leaf);background:var(--green-soft)}
.ch.right .n{background:var(--leaf);color:#fff}
.ch.wrong{border-color:var(--red);background:var(--red-soft)}
.ch.wrong .n{background:var(--red);color:#fff}
.answered .ch{cursor:default}
.answered .ch:not(.right):not(.wrong){opacity:.55}

.result{margin-top:14px;border-radius:14px;padding:12px 14px;display:none}
.result.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result.ok{background:var(--green-soft);border-left:6px solid var(--leaf)}
.result.no{background:var(--red-soft);border-left:6px solid var(--red)}
.result .hd{font-family:Jua,sans-serif;font-size:20px}
.result.ok .hd{color:var(--leaf)} .result.no .hd{color:var(--red)}
.result .ex{font-size:15px;margin-top:4px;word-break:keep-all}
.result .ex b{color:var(--jungle)}

.navrow{display:flex;gap:10px;margin-top:14px}
.navrow button{border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:700}
.prev{flex:0 0 auto;background:var(--card);border:1px solid var(--line)!important;color:var(--muted)}
.next{flex:1;background:var(--jungle);color:var(--amber)}
.next:disabled{background:#d8d2c3;color:#8a8577}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:10px}

/* 끝 화면 */
.done{text-align:center}
.done .big{font-size:64px;line-height:1.1}
.done h2{margin:6px 0 2px;font-size:28px}
.done .score{font-family:Jua,sans-serif;font-size:46px;color:var(--leaf);line-height:1.2}
.done .msg{color:var(--muted);margin-bottom:12px}
.done .wl{text-align:left;margin:10px 0 4px}
.done .wl div{background:var(--red-soft);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.done .btns{display:grid;gap:10px;margin-top:14px}
.done .btns button{border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:700}
.b-red{background:var(--red);color:#fff}
.b-dark{background:var(--jungle);color:var(--amber)}
.b-plain{background:var(--card);border:1px solid var(--line)!important;color:var(--ink)}
body.quiz header{display:none}
body.quiz main{padding-top:12px}
@media (max-width:480px){ .q{font-size:17px} .ch{font-size:15.5px;padding:9px 11px;margin-top:7px} .card{padding:16px 14px 14px} }
@media (max-width:360px){ .q{font-size:16.5px} .ch{font-size:15px} }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="kicker jua">중2 정보 · 형성평가</div>
    <h1 class="jua one">한 장씩 넘기는 정보 문제</h1>
    <p class="one">보기를 누르면 바로 채점하고 풀이를 보여 줘요.</p>
  </div>
</header>
<main id="app"></main>

<script>
/* 문제: 드라이브 「정보 형성평가 문제.pdf」 + 「정보 형성평가 정답과 풀이」 (84문항)
   a = 정답 번호(1~5), box = 보기 상자 */
const UNITS = [
{ id:"1-1", name:"컴퓨팅 시스템과 운영체제", qs:[
 {q:"컴퓨팅 시스템의 동작을 제어하고 모든 프로그램을 실행하는 가장 핵심적인 하드웨어 장치는?",
  c:["메인보드","중앙 처리 장치(CPU)","주기억 장치(RAM)","보조 기억 장치(SSD)","전원 장치"],a:2,
  e:"CPU(중앙 처리 장치)는 명령을 해석·실행하며 컴퓨팅 시스템의 모든 동작을 제어하는 핵심 장치이다. 메인보드는 부품을 연결하는 판, RAM·SSD는 기억 장치이다."},
 {q:"주기억 장치(RAM)의 특징으로 옳은 것은?",
  c:["전원이 꺼져도 저장된 내용이 유지된다.","대용량 데이터 보관용으로 접근 속도가 느리다.","실행 중인 프로그램이나 데이터를 임시 저장하며 전원이 꺼지면 내용이 사라진다.","대표적으로 하드 디스크(HDD)와 반도체 기억소자(SSD)가 있다.","기억 용량당 가격이 보조 기억 장치보다 저렴하다."],a:3,
  e:"RAM은 실행 중인 프로그램과 데이터를 임시로 저장하고 전원이 꺼지면 내용이 사라진다(휘발성). ①·②·④는 보조 기억 장치의 특징이고, ⑤ RAM은 용량당 가격이 보조 기억 장치보다 비싸다."},
 {q:"다음 중 데이터를 입력받기 위해 사용하는 '입력 장치'에 해당하는 것은?",
  c:["모니터","스피커","키보드","프린터","이어폰"],a:3,
  e:"키보드는 입력 장치이다. 모니터·스피커·프린터·이어폰은 출력 장치이다."},
 {q:"스마트폰이나 태블릿 컴퓨터 등 모바일 기기에서 주로 사용하는 운영체제(OS)로 옳게 짝지어진 것은?",
  c:["Windows, macOS","Android, iOS","Linux, Windows","macOS, Linux","Unix, macOS"],a:2,
  e:"모바일 기기용 운영체제는 Android(구글)와 iOS(애플)이다. Windows·macOS·Linux·Unix는 주로 PC·서버용이다."},
 {q:"컴퓨팅 시스템의 동작 과정 3단계를 순서대로 옳게 나열한 것은?",
  c:["실행 → 부팅 → 종료","부팅 → 종료 → 실행","부팅 → 실행 → 종료","로드 → 부팅 → 실행","실행 → 로드 → 종료"],a:3,
  e:"전원을 켜 운영체제를 불러오는 '부팅' → 프로그램 '실행' → 작업을 마치고 '종료'하는 순서이다."},
 {q:"사용자가 응용 소프트웨어를 실행할 때 데이터와 프로그램이 이동하고 처리되는 원리로 옳은 것은?",
  c:["보조 기억 장치 → 주기억 장치 → 중앙 처리 장치(CPU)","중앙 처리 장치(CPU) → 보조 기억 장치 → 주기억 장치","주기억 장치 → 보조 기억 장치 → 중앙 처리 장치(CPU)","입력 장치 → 보조 기억 장치 → 중앙 처리 장치(CPU)","출력 장치 → 주기억 장치 → 보조 기억 장치"],a:1,
  e:"보조 기억 장치의 프로그램·데이터가 주기억 장치로 옮겨진(로드) 뒤, CPU가 주기억 장치에서 명령을 가져와 처리한다."},
 {q:"부팅 과정에서 보조 기억 장치에 저장된 운영체제를 주기억 장치로 불러오는 동작을 나타내는 용어는?",
  c:["덤프(Dump)","로드(Load)","인코딩(Encoding)","컴파일(Compile)","스와핑(Swapping)"],a:2,
  e:"보조 기억 장치의 운영체제를 주기억 장치로 불러오는 것을 로드(Load)라고 한다."},
 {q:"주기억 장치에 탑재되어 중앙 처리 장치(CPU)에 의해 현재 실행되고 있는 프로그램을 무엇이라 하는가?",
  c:["아이콘(Icon)","프로세스(Process)","스레드(Thread)","모듈(Module)","패킷(Packet)"],a:2,
  e:"주기억 장치에 올라와 CPU가 실행하고 있는 프로그램을 프로세스(Process)라고 한다."},
 {q:"다음 중 운영체제(OS)의 주요 역할 및 기능으로 적절하지 않은 것은?",
  c:["프로세스 간 우선순위 부여 및 실행 시간 분배","주기억 장치의 작업 공간 관리 및 프로세스 할당/회수","저장 장치 내 파일과 폴더의 저장 및 관리","컴퓨팅 시스템 하드웨어 부품의 물리적 생산 및 조립","다른 컴퓨팅 시스템과의 통신 기능 제공 및 네트워크 장치 관리"],a:4,
  e:"운영체제는 프로세스·메모리·파일·네트워크를 관리한다. 하드웨어 부품의 물리적 생산·조립은 운영체제의 역할이 아니다."},
 {q:"근거리 무선 통신 기술로, 휴대 전화를 이용한 결제나 교통카드 등에 널리 쓰이는 통신 장치 기술은?",
  c:["USB","NFC","LAN","Bluetooth","Wi-Fi"],a:2,
  e:"NFC(근거리 무선 통신)는 약 10cm 이내 가까운 거리에서 통신하는 기술로, 휴대 전화 결제·교통카드에 쓰인다. Bluetooth·Wi-Fi는 더 먼 거리용 무선 통신이다."}
]},
{ id:"1-2", name:"피지컬 컴퓨팅", qs:[
 {q:"다음 중 피지컬 컴퓨팅(Physical Computing)에 대한 설명으로 가장 옳지 않은 것은?",
  c:["실생활의 물리적 데이터를 디지털 기기로 입력받아 처리한다.","입력된 데이터를 소프트웨어로 처리한 후 물리적인 형태로 출력한다.","주위 밝기에 따라 자동으로 켜지는 가로등은 피지컬 컴퓨팅의 한 예이다.","오직 모니터 화면으로만 결과를 출력해야 피지컬 컴퓨팅이라고 할 수 있다.","센서를 활용하여 실생활에 유용한 신제품이나 창의적인 작품을 개발할 수 있다."],a:4,
  e:"피지컬 컴퓨팅의 출력은 모니터뿐 아니라 빛(LED), 소리(스피커), 움직임(모터) 등 물리적인 형태로 나올 수 있다."},
 {q:"피지컬 컴퓨팅 시스템의 3대 구성 요소와 그에 대한 설명의 연결이 올바른 것은?",
  c:["센서 - 처리된 정보를 빛이나 소리, 움직임으로 출력하는 장치","마이크로컨트롤러(MCU) - 대상의 정보를 수집하여 기계 신호로 바꾸는 입력 장치","액추에이터 - CPU와 메모리가 하나의 칩으로 이루어진 소형 컴퓨터 장치","센서 - 빛, 온도, 소리 등의 물리적 데이터를 수집하는 입력 소자","액추에이터 - 센서에서 보낸 신호를 계산하고 저장된 소프트웨어를 실행하는 장치"],a:4,
  e:"센서는 빛·온도·소리 등 물리적 데이터를 수집하는 입력 소자이다. ① 출력 장치는 액추에이터, ② MCU는 처리 장치, ③ CPU와 메모리가 한 칩에 든 소형 컴퓨터는 MCU, ⑤ 신호를 계산·처리하는 것은 MCU이다."},
 {q:"다음 중 피지컬 컴퓨팅 시스템에서 '입력 장치(센서)'에 해당하는 것으로만 짝지어진 것은?",
  c:["빛 센서, 스피커","마이크 센서, DC 모터","수분 센서, 압력 센서","LED, 서보 모터","온습도 센서, 액정(LCD)"],a:3,
  e:"수분 센서와 압력 센서는 모두 입력 장치이다. 스피커·DC 모터·LED·서보 모터·액정(LCD)은 출력 장치이다."},
 {q:"다음 중 피지컬 컴퓨팅의 처리 장치인 마이크로컨트롤러(MCU) 보드의 종류에 해당하지 않는 것은?",
  c:["마이크로비트(micro:bit)","아두이노(Arduino)","라즈베리 파이(Raspberry Pi)","오렌지보드(Orangeboard)","라이다(LiDAR)"],a:5,
  e:"마이크로비트·아두이노·라즈베리 파이·오렌지보드는 MCU 보드이다. 라이다(LiDAR)는 레이저로 거리를 재는 센서(입력 장치)이다."},
 {q:"다음 중 피지컬 컴퓨팅의 출력 장치인 '액추에이터(Actuator)'의 예시와 그 작동 결과의 연결로 옳지 않은 것은?",
  c:["LED - 빛 출력","스피커 - 소리 출력","DC 모터 - 회전 및 움직임 출력","액정 화면 - 시각 정보 표시 출력","가속도 센서 - 위치 변화 및 기울기 출력"],a:5,
  e:"가속도 센서는 움직임·기울기를 감지하는 입력 장치(센서)이지 출력 장치(액추에이터)가 아니다."},
 {q:"마이크로비트(micro:bit) 보드에 내장된 기능 중 '출력 장치'에 해당하는 것은?",
  c:["터치 센서","A, B 버튼","마이크 센서","나침반 센서","스피커"],a:5,
  e:"스피커는 소리를 내보내는 출력 장치이다. 터치 센서·A·B 버튼·마이크 센서·나침반 센서는 입력 장치이다."},
 {q:"가정에서 사용되는 가전제품과 피지컬 컴퓨팅 기술의 적용 설명으로 옳지 않은 것은?",
  c:["세탁기 - 세탁물의 무게를 감지하여 세탁 방식을 설정한다.","식기 세척기 - 오염도를 감지하여 물 사용량을 조절하고 건조 온도를 관리한다.","공기 청정기 - 실내 먼지 농도를 측정하여 자동으로 공기를 순환시킨다.","냉장고 - 음식의 유통기한을 감지하여 자동으로 조작 명령을 내린다.","에어컨 - 실내 온도 및 사람의 위치와 거리를 감지하여 온도를 조절한다."],a:4,
  e:"냉장고는 내부 온도를 감지하여 냉각을 조절한다. 음식의 유통기한을 감지하는 것이 아니므로 옳지 않다."},
 {q:"사물 인터넷(IoT)과 라이다(LiDAR) 기술에 대한 설명 중 옳은 것을 모두 고른 것은?",
  box:["ㄱ. 사물 인터넷(IoT)은 사물에 센서와 프로세서를 장착하여 인터넷으로 연결한 시스템이다.","ㄴ. 라이다(LiDAR)는 고출력의 펄스 레이저를 발사하여 물체와의 거리 정보를 획득한다.","ㄷ. 라이다는 자율주행 자동차의 전방 사물 인지에 핵심적으로 활용된다.","ㄹ. 라이다는 레이더나 카메라를 완전히 대체하므로 자율주행차에는 레이더가 필요 없다."],
  c:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],a:4,
  e:"ㄱ·ㄴ·ㄷ은 옳다. ㄹ: 라이다는 레이더·카메라를 완전히 대체하지 못하며, 자율주행차는 라이다·레이더·카메라를 함께 사용해 서로의 약점을 보완한다."},
 {q:"피지컬 컴퓨팅이 사회 및 공공시설에 활용된 사례로 옳지 않은 것은?",
  c:["스마트 가로등 - 주위의 밝기나 환경 정보를 감지하여 자동 점등 및 정보 수집","횡단보도 신호등 - 무단 횡단을 경고하거나 보행자의 잔여 시간을 표시","자동문 및 엘리베이터 - 사람의 접근을 감지하고 끼임 사고를 방지","어린이 보호 구역 경보기 - 스마트 모션 센서와 AI 카메라로 보행자/차량 접근 알림","수동식 손소독제 - 사람이 직접 레버를 밟아야만 소독액이 나오는 전통식 장치"],a:5,
  e:"사람이 직접 레버를 밟아야 하는 수동식 장치는 센서로 감지하고 자동으로 동작하는 피지컬 컴퓨팅 사례가 아니다."},
 {q:"센서를 활용하여 실생활 문제 해결 방안을 모색한 사례로 가장 적절한 것은?",
  c:["시각 장애인이 전화기를 사용하는 어려움을 해결하기 위해 음성 인식 센서를 활용하여 말로 전화를 걸 수 있도록 구성하였다.","청각 장애인을 위해 음악 소리를 더 크게 출력하도록 스피커의 출력 전압만 높였다.","어두운 밤길의 안전을 위해 낮에도 가로등이 계속 켜져 있도록 스위치를 고정하였다.","공장 안내 로봇이 장애물을 만나면 정지하지 않고 계속 직진하도록 센서를 제거하였다.","세탁기의 진동을 줄이기 위해 탈수 기능을 완전히 삭제하였다."],a:1,
  e:"음성 인식 센서로 시각 장애인의 불편(전화 걸기)을 해결한 ①이 센서 활용 사례이다. ②~⑤는 센서를 쓰지 않거나 오히려 없애 문제를 해결하지 못한다."}
]},
{ id:"2-1", name:"데이터 유형과 표현", qs:[
 {q:"데이터와 디지털 표현에 대한 설명으로 가장 옳지 않은 것은?",
  c:["데이터는 관찰이나 조사를 통해 얻은 사실로, 가공을 통해 유용한 가치를 가진다.","아날로그 데이터는 자연 상태의 값을 연속적인 형태로 표현하는 방식이다.","디지털 데이터는 시간이나 온도 등 연속적인 값을 일정 간격으로 끊어서 0과 1로 나타낸다.","디지털 데이터는 인터넷을 통한 빠른 공유가 가능하며 수정과 관리가 용이하다.","디지털 데이터는 시간이 지남에 따라 원본 데이터의 복사본 화질이나 성능이 저하되는 단점이 있다."],a:5,
  e:"디지털 데이터는 여러 번 복사해도 원본과 똑같은 품질이 유지된다. 복사할수록 품질이 떨어지는 것은 아날로그 데이터의 특징이다."},
 {q:"컴퓨터에서 사용하는 데이터 단위 및 표현 상태 수에 대한 설명으로 옳은 것을 <보기>에서 모두 고른 것은?",
  box:["ㄱ. 1비트(bit)는 0과 1 두 가지 상태를 표현할 수 있다.","ㄴ. 3비트를 사용하면 총 6가지의 서로 다른 데이터를 표현할 수 있다.","ㄷ. 1바이트(byte)는 8개의 비트로 구성되며 256가지의 상태를 표현한다.","ㄹ. 데이터 크기 단위에서 1MB는 정확히 1,000KB이다."],
  c:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],a:2,
  e:"ㄱ(옳음) 1비트는 0, 1 두 가지. ㄴ(틀림) 3비트는 2³ = 8가지. ㄷ(옳음) 1바이트 = 8비트, 2⁸ = 256가지. ㄹ(틀림) 1MB = 1,024KB."},
 {q:"데이터 단위의 크기를 작은 것부터 큰 순서대로 올바르게 나열한 것은?",
  c:["Byte < KB < GB < MB < TB","Byte < KB < MB < GB < TB","Byte < MB < KB < GB < PB","KB < Byte < MB < GB < TB","Byte < KB < MB < TB < GB"],a:2,
  e:"Byte < KB < MB < GB < TB (한 단계마다 1,024배). 그다음은 PB이다."},
 {q:"10진수 55를 2진수로 바르게 변환한 것은?",
  c:["110111₂","110110₂","110101₂","101111₂","111001₂"],a:1,
  e:"55 = 32 + 16 + 4 + 2 + 1 → 110111₂. (2로 계속 나눈 나머지 1,1,1,0,1,1을 거꾸로 읽어도 110111)"},
 {q:"2진수 10011011₂를 10진수로 바르게 변환한 것은?",
  c:["147","153","155","161","175"],a:3,
  e:"10011011₂ = 128 + 16 + 8 + 2 + 1 = 155."},
 {q:"2진수 11011010₂를 16진수로 바르게 변환한 것은?",
  c:["D5","DA","C10","EB","E10"],a:2,
  e:"뒤에서부터 4자리씩 끊는다: 1101 | 1010 → 13(D) | 10(A) → DA₁₆."},
 {q:"아스키(ASCII) 코드에 대한 설명으로 옳지 않은 것은?",
  c:["미국 표준 협회(ANSI)에서 제정한 문자 코드이다.","기본적으로 7비트를 사용하여 128(2⁷)개의 문자를 표현한다.","통신 전송 시에는 오류 검사를 위한 비트를 포함하여 8비트를 사용한다.","영문 대소문자, 숫자, 특수 기호 등을 표현할 수 있다.","7비트 구성이므로 영문자뿐만 아니라 한글과 한자도 충분히 표현 가능하다."],a:5,
  e:"아스키 코드는 7비트로 128개 문자만 표현하므로 영문·숫자·기호만 나타낼 수 있고, 한글·한자는 표현할 수 없다."},
 {q:"유니코드(Unicode)에 대한 설명으로 가장 적절한 것은?",
  c:["8비트를 사용하여 전 세계 256개 문자만을 표현할 수 있는 코드이다.","영문자 표기를 전담하기 위해 만들어진 미국 전용 표준 코드이다.","16비트를 사용하여 65,536가지의 문자를 표현하며 전 세계 문자를 통일하여 표기한다.","한글은 완성형 2,350자만 표기할 수 있으며 나머지 한글 글자는 표기할 수 없다.","컴퓨터 내부에서 문자를 표현할 때 이진수가 아닌 10진수로 직접 처리하는 방식이다."],a:3,
  e:"유니코드는 16비트로 65,536가지 문자를 표현하여 전 세계 문자를 하나의 체계로 통일해 나타낸다. ① 8비트 256자는 확장 아스키, ② 미국 표준은 아스키, ④ 유니코드는 현대 한글 11,172자를 모두 표기하고, ⑤ 컴퓨터 내부는 2진수로 처리한다."},
 {q:"한글 데이터 표현 방식 중 '완성형 코드'와 '조합형 코드'에 대한 설명으로 옳은 것은?",
  c:["완성형 코드는 초성, 중성, 종성에 각각 코드를 부여하여 결합하는 방식이다.","조합형 코드는 자주 사용하는 한글 2,350자에 대해서만 사전에 코드를 부여한 방식이다.","유니코드의 한글 표기는 완성형 코드 방식을 기본으로 바탕에 두고 있다.","조합형 코드는 완성형 코드보다 기억 장치 용량을 훨씬 많이 차지한다.","완성형 코드를 사용하면 현대 한글 11,172자를 하나도 빠짐없이 모두 표현할 수 있다."],a:3,
  e:"유니코드의 한글은 완성된 글자 하나하나에 코드를 주는 완성형 방식(11,172자)이다. ① 초성·중성·종성을 결합하는 것은 조합형, ② 2,350자에만 코드를 준 것은 완성형(KS) 코드, ④ 조합형은 적은 코드로 글자를 만들어 오히려 용량이 적고, ⑤ 2,350자 완성형으로는 모든 글자를 표현하지 못한다."},
 {q:"하나의 픽셀에 할당된 비트 수와 표현할 수 있는 색상 수의 관계에 대한 설명으로 옳은 것은?",
  c:["1비트 픽셀은 총 4가지 색상을 표현할 수 있다.","8비트 픽셀은 2⁸ = 256가지 색상을 표현할 수 있다.","24비트 픽셀은 24가지의 기본 색상만 표현할 수 있다.","픽셀당 비트 수가 늘어나도 표현 가능한 색상의 수에는 변화가 없다.","트루컬러(True Color)는 8비트 픽셀을 사용하여 현실의 모든 색을 표현한다."],a:2,
  e:"픽셀당 n비트이면 2ⁿ가지 색을 표현한다. 8비트는 2⁸ = 256가지. ① 1비트는 2가지, ③ 24비트는 약 1,677만 가지, ④ 비트 수가 늘면 색상 수도 늘고, ⑤ 트루컬러는 24비트이다."},
 {q:"이미지의 해상도(Resolution) 및 PPI(Pixels Per Inch)에 대한 설명으로 가장 옳지 않은 것은?",
  c:["PPI는 가로·세로 1인치 공간 안에 들어가는 픽셀의 개수를 의미한다.","동일한 면적에서 픽셀 수(PPI)가 많을수록 해상도가 높아진다.","해상도가 높아질수록 이미지가 더 정밀하고 선명하게 표현된다.","해상도가 높아지면 이미지를 구성하는 데이터 용량이 크게 증가한다.","PPI 수치가 높아질수록 저장 용량이 줄어들어 파일 전송 속도가 빨라진다."],a:5,
  e:"PPI가 높을수록 픽셀 수가 많아져 이미지는 선명해지지만 저장 용량은 커지고 전송 속도는 느려진다."},
 {q:"디지털 그래픽 표현 방식 중 '비트맵(Bitmap)' 방식의 특징으로 옳은 것은?",
  c:["점, 선, 곡선 등의 수학적 연산 공식에 의해 이미지를 표현한다.","이미지를 확대하거나 축소해도 화질의 손상이나 윤곽선 변형이 전혀 없다.","픽셀이라는 작은 사각형 점들의 배열로 이미지를 표현한다.","대표적인 파일 형식으로 WMF, SVG 등이 있다.","용량이 매우 작아서 웹 타이포그래피나 로고 제작에 주로 사용된다."],a:3,
  e:"비트맵은 픽셀이라는 작은 사각형 점들의 배열로 이미지를 표현한다. ①·②·④·⑤는 벡터 방식의 특징이다."},
 {q:"디지털 그래픽 표현 방식 중 '벡터(Vector)' 방식의 특징으로 옳지 않은 것은?",
  c:["수학적 개체(점, 선, 면, 곡선)의 좌표 및 방정식을 이용하여 이미지를 표현한다.","이미지를 대폭 확대하더라도 윤곽선이 뭉개지거나 계단 현상이 나타나지 않는다.","로고, 캐릭터 디자인, 아이콘 표현 등에 매우 적합하다.","정교한 인물 사진이나 자연 풍경 사진을 표현할 때 비트맵보다 훨씬 자연스럽고 효율적이다.","파일 확장자로는 SVG, WMF, EMF 등이 사용된다."],a:4,
  e:"정교한 인물·풍경 사진처럼 색 변화가 많은 이미지는 비트맵 방식이 알맞다. 벡터는 로고·아이콘처럼 단순한 도형에 적합하다."},
 {q:"비트맵 이미지와 벡터 이미지를 비교한 설명으로 올바른 것은?",
  c:["비트맵은 확대 시 계단 현상이 없으나 벡터는 계단 현상이 심하게 발생한다.","다양한 색상 변화를 가진 실사 사진 표현에는 비트맵 방식이 벡터 방식보다 유리하다.","벡터 방식은 픽셀 단위로 색상을 하나하나 보정하고 수정하기에 적합하다.","비트맵 방식은 이미지 크기를 10배 확대해도 저장 용량이 일정하게 유지된다.","비트맵의 대표적 확장자에는 SVG가 있으며 벡터의 대표적 확장자에는 JPEG가 있다."],a:2,
  e:"실사 사진은 비트맵이 유리하다. ① 확대 시 계단 현상은 비트맵에서 생긴다. ③ 픽셀 단위 보정은 비트맵. ④ 비트맵은 크기를 키우면 용량도 커진다. ⑤ SVG는 벡터, JPEG는 비트맵 확장자이다."},
 {q:"소리 데이터를 디지털 데이터로 변환하는 3단계 과정을 순서대로 바르게 나열한 것은?",
  c:["표본화 → 부호화 → 양자화","양자화 → 표본화 → 부호화","표본화 → 양자화 → 부호화","부호화 → 양자화 → 표본화","양자화 → 부호화 → 표본화"],a:3,
  e:"소리의 디지털 변환: 표본화(Sampling, 일정 간격으로 나눔) → 양자화(Quantization, 높낮이를 정수로) → 부호화(Encoding, 2진수로)."},
 {q:"소리의 디지털 변환 3단계에 대한 세부 설명으로 옳은 것을 <보기>에서 모두 고른 것은?",
  box:["ㄱ. 표본화 단계는 연속적인 소리 파형을 일정한 시간 간격으로 나눈다.","ㄴ. 양자화 단계는 추출한 표본의 높낮이를 가장 가까운 정숫값으로 변환한다.","ㄷ. 부호화 단계는 정수로 표현된 양자화 값을 2진수(0과 1)로 변환한다.","ㄹ. 표본 추출 시간 간격을 넓게 설정할수록 원음과 거의 동일한 고품질 소리가 얻어진다."],
  c:["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],a:3,
  e:"ㄱ·ㄴ·ㄷ은 옳다. ㄹ: 표본 추출 간격을 좁게(촘촘하게) 할수록 원음에 가까운 고품질 소리를 얻는다."},
 {q:"소리 데이터 파일 형식에 대한 설명으로 옳지 않은 것은?",
  c:["WAV 파일은 압축되지 않은 원음을 그대로 저장하여 고품질이지만 용량이 크다.","MP3는 MPEG-1 Audio Layer 3의 약자로 대중적으로 가장 많이 사용되는 음원 파일이다.","MP3는 사람이 들을 수 없는 가청 주파수 외의 영역을 제거하여 용량을 줄인 압축 방식이다.","MP3 기술을 이용하면 음질의 큰 손상 없이 원음 파일 용량을 획기적으로 줄일 수 있다.","MP3는 비디오와 자막 데이터까지 함께 저장하는 통합 동영상 멀티미디어 규격이다."],a:5,
  e:"MP3는 소리(오디오)만 저장하는 압축 음원 형식이다. 비디오와 자막까지 함께 저장하는 것은 MP4 같은 동영상 형식이다."},
 {q:"동영상 데이터의 구성 요소인 '프레임(Frame)'과 '프레임률(fps)'에 대한 설명으로 옳은 것은?",
  c:["프레임은 동영상에서 연속으로 재생되는 소리의 주파수를 의미한다.","프레임률(fps)은 1분 동안 재생되는 소리 표본의 개수를 나타낸다.","24fps는 1초 동안 24장의 정지 이미지가 연속적으로 전환되어 표시됨을 뜻한다.","프레임률이 낮아질수록 화면의 움직임이 더욱 부드럽고 자연스러워진다.","프레임률이 높을수록 파일의 데이터 저장 용량은 줄어든다."],a:3,
  e:"fps는 1초에 보여 주는 정지 이미지(프레임) 수이다. 프레임률이 높을수록 움직임이 부드럽고 용량은 커진다."},
 {q:"동영상 데이터 표현 및 파일 형식에 대한 설명으로 가장 옳지 않은 것은?",
  c:["동영상은 수많은 정지 이미지(프레임)와 소리가 시간 축을 따라 합성된 데이터이다.","동일한 길이의 동영상이라도 프레임률을 올리면 용량이 커지게 된다.","일반 동영상에 비해 슬로 모션 동영상은 더 높은 프레임률(예: 120fps, 240fps)로 촬영된다.","대표적인 동영상 확장자에는 AVI, MOV, MP4 등이 있다.","MP4는 오직 오디오 데이터만 저장할 수 있는 단일 음원 파일 형식이다."],a:5,
  e:"MP4는 영상·소리·자막을 함께 담는 동영상 파일 형식이다. 오디오만 저장하는 음원 형식은 MP3이다."},
 {q:"데이터 유형별 디지털 표현 방식에 대한 종합 설명 중 옳은 것은?",
  c:["16진수 1A₁₆를 2진수로 바꾸면 0001 1010₂이 된다.","아스키 코드는 16비트로 문자를 표현하므로 한글 '세종'을 자유롭게 표현할 수 있다.","비트맵 그래픽은 아무리 확대해도 계단 현상이 전혀 발생하지 않는다.","소리의 디지털화 과정에서 양자화는 정수값을 이진수로 변환하는 최종 단계이다.","유니코드는 영문자만을 표현하기 위해 제정된 미국 국립 표준 코드이다."],a:1,
  e:"16진수 한 자리는 2진수 4자리이다. 1 → 0001, A(10) → 1010이므로 1A₁₆ = 0001 1010₂. ② 아스키는 7비트로 한글 불가, ③ 비트맵은 확대하면 계단 현상, ④ 2진수로 바꾸는 단계는 부호화, ⑤ 영문자 중심 미국 표준은 아스키이다."}
]},
{ id:"2-2", name:"데이터 수집과 관리 및 구조화", qs:[
 {q:"데이터 시각화에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["복잡한 데이터를 표, 그래프, 그림, 지도 등의 형태로 표현하는 것이다.","데이터 속에서 중요한 부분을 빠르게 찾아내는 데 도움을 준다.","데이터의 각종 수치 변화나 패턴을 한눈에 쉽게 이해할 수 있다.","숫자로 이루어진 모든 데이터를 일일이 문장 형태의 글로 풀어 적는 것이다.","걷기 심박수 평균이나 설문 조사 결과를 시각화하여 표현할 수 있다."],a:4,
  e:"데이터 시각화는 복잡한 데이터를 표·그래프·그림·지도로 나타내는 것이다. 숫자 데이터를 일일이 글로 풀어 쓰는 것은 시각화가 아니다."},
 {q:"데이터 수집 도구 및 매체에 대한 설명으로 옳지 않은 것은?",
  c:["정보 수집 방법에는 책, 신문, 방송 매체, 설문 조사 등이 있다.","검색 엔진은 인터넷상에서 원하는 데이터를 키워드로 찾도록 돕는 도구이다.","해시태그는 주로 SNS에서 # 기호 뒤에 키워드를 붙여 사용하는 형태이다.","웨어러블 장치나 스마트폰을 활용하여 실시간 데이터를 수집할 수 있다.","효율적인 데이터 수집을 위해서는 데이터 수집 목적보다 수집 매체를 먼저 정해야 한다."],a:5,
  e:"먼저 데이터 수집 목적을 정해야 그에 맞는 수집 매체를 고를 수 있다. 순서가 거꾸로이다."},
 {q:"수집한 날씨 데이터의 유형 분류가 바르게 짝지어진 것은?",
  c:["온도, 습도, 강수량 - 수치 데이터","구름의 양, 날씨 기호 - 동영상 데이터","태풍의 이동 경로, 장마 전선의 위치 변화 - 이미지 데이터","강수량 숫자 데이터 - 동영상 데이터","기상청 날씨 기호 - 수치 데이터"],a:1,
  e:"온도·습도·강수량은 숫자로 나타내는 수치 데이터이다. 구름의 양·날씨 기호는 이미지, 태풍 이동 경로·장마 전선 변화는 동영상, 강수량 숫자는 수치 데이터이다."},
 {q:"데이터를 스마트폰 사용 시간대별(오전, 오후, 저녁) 또는 용도별(통화, 게임, SNS)로 나누어 정리하는 데이터 관리 단계는 무엇인가?",
  c:["데이터 파기","데이터 분류","데이터 변조","데이터 무작위 나열","데이터 삭제"],a:2,
  e:"같은 특징(시간대, 용도)에 따라 나누어 정리하는 단계는 데이터 분류이다."},
 {q:"데이터 처리 및 활용에 사용되는 응용 소프트웨어와 주요 기능의 연결이 가장 적절하지 않은 것은?",
  c:["스프레드시트 - 데이터를 표 형태로 정리하거나 그래프로 시각화함","워드 프로세서 - 보고서나 문서 작성 시 표와 글로 정리함","그래픽 편집 프로그램 - 이미지를 활용하여 시각적으로 표현함","동영상 편집 프로그램 - 시간에 따른 변화를 동영상으로 편집하여 파악함","스프레드시트 - 텍스트 전용 동영상 애니메이션 제작을 전담함"],a:5,
  e:"스프레드시트는 데이터를 표로 정리하고 계산·그래프를 만드는 프로그램이다. 동영상 애니메이션 제작은 동영상 편집 프로그램의 기능이다."},
 {q:"데이터 저장 및 활용에 관한 설명으로 옳은 것은?",
  c:["처리된 데이터는 네트워크나 물리적 저장 매체를 통해 저장하고 공유할 수 있다.","데이터 수집 후에는 개인정보나 저작권 침해 문제는 전혀 고려하지 않아도 된다.","데이터는 무조건 개인 컴퓨터 한 곳에만 물리적으로 보관하고 공유는 금지해야 한다.","수집한 데이터는 어떠한 경우에도 문제를 해결하는 데 재활용될 수 없다.","데이터 활용 단계에서는 네트워크 저장 매체를 사용할 수 없다."],a:1,
  e:"처리된 데이터는 네트워크나 USB 같은 물리적 저장 매체로 저장·공유할 수 있다. 수집·활용 시에는 개인정보와 저작권을 반드시 고려해야 한다."},
 {q:"'데이터 구조화'의 정의로 가장 올바른 것은?",
  c:["데이터를 임의의 순서로 아무렇게나 정렬하지 않고 흩뿌려 놓는 것","데이터를 특징에 따라 분류하여 관계를 표현하고 정돈된 형태로 나타내는 것","수집한 데이터 중 수치 데이터만을 제외하고 모두 삭제하는 것","복잡한 데이터를 시각 자료 없이 오직 텍스트로만 나열하는 과정","데이터의 사용 목적과 관계없이 용량을 최대한 늘리는 작업"],a:2,
  e:"데이터 구조화는 데이터를 특징에 따라 분류하고 관계를 표현하여 정돈된 형태로 나타내는 것이다."},
 {q:"데이터를 '목록' 및 '표'로 구조화하는 방식에 대한 설명으로 옳은 것은?",
  c:["목록 구조화는 서로 다른 3개 이상의 기준을 세로 열에만 표시하는 방식이다.","표 구조화는 가로와 세로에 두 가지 서로 다른 기준을 두고 데이터를 정리하는 방식이다.","백화점 층별 안내는 가장 대표적인 표 구조화의 예시이다.","계절별 평균 기온 정리 표는 목록으로 구조화하기의 대표 사례이다.","표로 구조화하면 데이터를 편집하거나 관리하기가 훨씬 불리해진다."],a:2,
  e:"표는 가로와 세로에 서로 다른 두 기준을 두고 정리한다. 백화점 층별 안내는 목록, 계절별 평균 기온은 표 구조화의 예이다."},
 {q:"계층형 다이어그램으로 구조화하기에 적합한 데이터 사례로만 짝지어진 것은?",
  c:["외갓집 기준 가계도, 책의 목차, 축구 경기 토너먼트 대진표","지하철 노선도, 기온 변화 선그래프, 원그래프","백화점 층별 안내, 주제별 세부 사항 목록","달력 형태의 연대표, 강수 확률 표","선수별 능력치 레이더 차트, 날씨 기호 표"],a:1,
  e:"가계도·책의 목차·토너먼트 대진표는 상하 관계가 있는 데이터이므로 계층형 다이어그램에 알맞다."},
 {q:"그래프형 다이어그램에 대한 설명으로 적절하지 않은 것은?",
  c:["데이터를 선, 막대, 원 등의 모양을 이용해 시각적으로 표현한다.","수치의 변화나 값의 비교를 한눈에 파악하기 쉽게 도와준다.","대표적인 예로 지하철 노선도, 기온 변화 선그래프, 강수량 막대그래프가 있다.","데이터 간의 상하 관계만을 나뭇가지 형태로 나타내는 방식이다.","두 명의 축구 선수 능력치를 비교할 때 레이더 차트(그래프형)를 활용할 수 있다."],a:4,
  e:"상하 관계를 나뭇가지 모양으로 나타내는 것은 계층형 다이어그램이다. 그래프형은 선·막대·원 등으로 수치 변화나 연결 관계를 나타낸다."}
]},
{ id:"4-1", name:"인공지능의 이해", qs:[
 {q:"인공지능(AI)의 개념 및 역사적 배경에 대한 설명으로 올바른 것은?",
  c:["인공지능은 프로그래머가 작성한 고정된 규칙만으로 항상 일정한 결과만을 출력하는 시스템이다.","'인공지능'이라는 용어는 1956년 다트머스 회의에서 존 매카시(John McCarthy) 박사가 처음 사용하였다.","인공지능은 반드시 오프라인 상태에서만 작동하도록 설계된 독립형 기계 장치를 의미한다.","인공지능 기술은 헬스케어나 자율주행 등 일부 특수 분야에만 제한적으로 적용될 수 있다.","인공지능은 사람의 개입 없이 데이터를 스스로 생성할 수 있으므로 초기의 데이터 수집 과정이 불필요하다."],a:2,
  e:"'인공지능'이라는 용어는 1956년 다트머스 회의에서 존 매카시가 처음 사용했다. 인공지능은 데이터로 학습하므로 데이터 수집이 꼭 필요하며, 여러 분야에 널리 쓰인다."},
 {q:"인공지능의 주요 특성 중 '특정 분야에 국한되지 않고 다양한 분야에 적용하여 문제를 효율적으로 해결할 수 있는 성질'을 뜻하는 용어는?",
  c:["범용성","정교성","고정성","안전성","신뢰성"],a:1,
  e:"특정 분야에 국한되지 않고 다양한 분야에 적용되는 성질은 범용성이다."},
 {q:"인공지능 시스템이 동작하는 3단계 과정을 순서대로 올바르게 나열한 것은?",
  c:["학습 및 모델 생성 → 학습 데이터 수집 및 분류 → 새로운 데이터에 관한 예측","새로운 데이터에 관한 예측 → 학습 및 모델 생성 → 학습 데이터 수집 및 분류","학습 데이터 수집 및 분류 → 학습 및 모델 생성 → 새로운 데이터에 관한 예측","학습 데이터 수집 및 분류 → 새로운 데이터에 관한 예측 → 학습 및 모델 생성","학습 및 모델 생성 → 새로운 데이터에 관한 예측 → 학습 데이터 수집 및 분류"],a:3,
  e:"학습 데이터 수집 및 분류 → 학습 및 모델 생성 → 새로운 데이터에 관한 예측의 순서이다."},
 {q:"일반 소프트웨어와 인공지능 소프트웨어의 차이점에 대한 설명으로 올바르지 않은 것은?",
  c:["일반 소프트웨어는 프로그래머가 미리 작성한 규칙에 따라 동작한다.","인공지능 소프트웨어는 새로운 데이터를 학습하여 성능을 향상시킬 수 있다.","일반 소프트웨어는 사전에 정의되지 않은 데이터가 입력되어도 적절히 대응하고 학습할 수 있다.","인공지능 소프트웨어는 데이터 기반의 학습, 추론, 문제 해결, 판단 등의 작업을 수행한다.","기계학습(머신러닝)과 딥러닝은 인공지능 소프트웨어를 구현하는 대표적인 인공지능 기술이다."],a:3,
  e:"미리 정의되지 않은 데이터에도 대응하고 학습하는 것은 인공지능 소프트웨어의 특징이다. 일반 소프트웨어는 정해진 규칙대로만 동작한다."},
 {q:"인공지능 학습을 위한 데이터 수집 및 처리 과정에 대한 설명으로 올바르지 않은 것은?",
  c:["인공지능에 잘못된 데이터를 학습시키면 잘못된 판단이나 예측 결과를 도출할 수 있다.","공공데이터포털(data.go.kr)에서는 국가나 공공기관이 개방한 다양한 공공 데이터를 활용할 수 있다.","인터넷 검색 사이트에서 이미지 데이터를 수집할 때에는 상업적 이용 및 저작권 사용 허용 범위를 확인해야 한다.","데이터 레이블링이란 데이터에 레이블(이름표)을 붙여 인공지능이 데이터의 종류를 식별할 수 있도록 처리하는 과정이다.","오픈 API는 오직 정부 기관만 접근할 수 있는 비공개 데이터 전용 네트워크 시스템을 의미한다."],a:5,
  e:"오픈 API는 누구나 데이터나 기능을 쓸 수 있도록 공개한 인터페이스이다. 정부 기관만 쓰는 비공개 시스템이 아니다."}
]},
{ id:"4-2", name:"인공지능 시스템의 구성 및 적용", qs:[
 {q:"자율주행 자동차의 자동화 단계에 대한 설명으로 옳은 것은?",
  c:["Level 0은 자동차가 도로의 모든 주행을 완벽히 제어하는 단계이다.","Level 1은 현재 가장 광범위하게 상용화된 완전 자율주행 단계이다.","Level 3은 부분 자동화 단계로 사람이 주행 환경을 함께 살펴봐야 하는 단계이다.","Level 5는 운전자가 직접 운전 조작을 전적으로 제어해야 하는 단계이다.","자율주행 단계는 Level 1부터 Level 10까지 총 10단계로 나누어진다."],a:3,
  e:"Level 3(조건부 자동화)은 시스템이 운전하지만 필요하면 사람이 개입해야 하므로 주행 환경을 함께 살펴야 한다. Level 0은 자동화 없음, Level 5는 완전 자동화이며, 단계는 Level 0~5의 6단계이다."},
 {q:"이미지 처리(Image Processing)의 개념을 가장 올바르게 설명한 것은?",
  c:["음성 데이터를 분석하여 텍스트로 자동 변환하는 과정","입력받은 이미지 데이터를 컴퓨팅 시스템이 이해할 수 있는 디지털 데이터로 변경하는 과정","로봇의 이동 경로에 위치한 장애물을 탐지하여 제어 명령을 내리는 기술","학습 데이터의 윤리적 문제를 검토하여 부적절한 데이터를 차단하는 알고리즘","컴퓨터 처리 속도를 올리기 위해 메모리와 프로세서를 최적화하는 과정"],a:2,
  e:"이미지 처리는 입력받은 이미지를 컴퓨팅 시스템이 이해할 수 있는 디지털 데이터로 바꾸어 다루는 과정이다."},
 {q:"이미지 데이터 기반 인공지능 시스템이 대상을 인식하는 순서로 올바른 것은?",
  c:["디지털 데이터 변환 → 데이터 분석 및 규칙 발견 → 특징 추출 → 대상 인식","데이터 분석 → 특징 추출 → 디지털 데이터 변환 → 대상 인식","대상 인식 → 규칙 발견 → 특징 추출 → 디지털 데이터 변환","특징 추출 → 디지털 데이터 변환 → 대상 인식 → 규칙 발견","규칙 발견 → 특징 추출 → 대상 인식 → 디지털 데이터 변환"],a:1,
  e:"원본 이미지를 디지털 데이터로 바꿈 → 데이터를 분석해 규칙 발견 → 특징 추출 → 대상 인식의 순서이다."},
 {q:"다음 상자 안에서 설명하는 인공지능 기술은 무엇인가?",
  box:["인간의 시각 능력을 모방하여 컴퓨터가 이미지나 동영상을 인식하고 분석하는 기술로, 복잡한 이미지 처리 및 분석 작업에 활용된다."],
  c:["자연어 처리(Natural Language Processing)","음성 인식(Speech Recognition)","컴퓨터 비전(Computer Vision)","전문가 시스템(Expert System)","강화 학습(Reinforcement Learning)"],a:3,
  e:"인간의 시각 능력을 모방해 이미지·동영상을 인식·분석하는 기술은 컴퓨터 비전이다."},
 {q:"인공지능 시스템의 구성 및 적용에 대한 설명으로 옳지 않은 것은?",
  c:["자율주행 자동차는 사람, 신호등, 장애물 등 도로 상의 다양한 요소를 인식한다.","특정 목적의 이미지 분류 인공지능을 구축하기 위해서는 목적에 맞는 이미지 학습이 필요하다.","인공지능은 카메라를 이용해 주변 환경의 이미지 데이터를 입력받을 수 있다.","데이터 수집과 활용 과정에서는 윤리적인 문제 해결 방안 구상이 요구된다.","이미지 데이터 기반 인공지능 시스템은 사전 학습 과정 없이 입력 이미지를 완벽히 인식한다."],a:5,
  e:"이미지 기반 인공지능은 미리 많은 이미지를 학습해야 대상을 인식할 수 있다. 학습 없이 완벽히 인식할 수는 없다."},
 {q:"데이터 수집 및 활용 과정에서 발생하는 인공지능 윤리적 문제와 그 설명이 바르게 연결되지 않은 것은?",
  c:["개인 정보 침해 - 학습 데이터 유출로 인한 프라이버시 침해","데이터 편향 - 편중된 데이터 학습으로 인한 차별적 판단 야기","데이터 신뢰성 - 신뢰할 수 없는 데이터 사용으로 인한 AI 성능 저하","데이터 무단 사용 - 권리자의 허가 없는 수집으로 인한 소유권 침해","사회적 분열 - 모든 사용자에게 동일한 보편적 정보만 지속 제공하여 발생하는 갈등"],a:5,
  e:"사회적 분열은 맞춤형 정보만 계속 제공해 비슷한 생각만 접하게 되면서(확증 편향·필터 버블) 생기는 갈등이다. '모두에게 동일한 보편적 정보'는 원인이 아니다."},
 {q:"인공지능 윤리 문제를 해결하기 위한 '법적 관점'의 방안에 해당하는 것은?",
  c:["다양성 존중 문화를 확산하여 데이터 수집 과정에 반영한다.","데이터 수집 및 활용에 관한 동의 절차를 강화하는 법률을 개정한다.","맞춤형 서비스의 위험성을 공론화하여 사회적 경계 분위기를 조성한다.","개인정보 보호 및 데이터 신뢰성 확보를 위한 윤리 기준과 규범을 제정한다.","데이터 소유권 침해 관련 범죄의 심각성을 알리는 교육 자료를 배포한다."],a:2,
  e:"법을 만들거나 고치는 것이 법적 관점의 방안이다. ①·③·⑤는 사회적 관점, ④ 윤리 기준·규범 제정은 윤리적 관점에 가깝다."},
 {q:"윤리적 문제 해결 방안 중 '사회적 관점'의 특징(장점 및 단점)으로 옳은 것은?",
  c:["법적인 처벌 조항이 있어 가장 강력한 강제력을 발휘한다.","급격한 기술 발전 속도를 제도가 따라가지 못하는 한계가 존재한다.","사회 구성원들의 참여와 협력을 바탕으로 문제를 해결할 수 있다.","법적·윤리적 기준 제정 시 강제력이 약해 실효성이 떨어진다.","다양한 의견에 대한 사회적 합의를 도출하는 데 비용과 시간이 전혀 들지 않는다."],a:3,
  e:"사회적 관점은 구성원의 참여와 협력으로 문제를 해결할 수 있는 것이 장점이고, 합의에 시간과 비용이 드는 것이 단점이다. ①·②는 법적 관점에 대한 설명이다."},
 {q:"다음 중 '윤리적 관점'의 해결 방안이 가지는 대표적인 단점(한계)으로 가장 적절한 것은?",
  c:["다양한 가치를 아우르는 기준 마련이 어렵고 법적 강제력이 약하다.","기술 발전 속도에 비해 규제 제정이 지나치게 느리다.","공론화 과정에서 사회 구성원 간의 심각한 법적 분쟁을 유발한다.","처벌 규정이 강하여 인공지능 산업 발전 자체를 위축시킨다.","특정 계층에게만 맞춤형 정보가 독점 제공되는 부작용이 있다."],a:1,
  e:"윤리적 관점(윤리 기준 마련)은 다양한 가치를 아우르는 기준을 만들기 어렵고, 법이 아니므로 강제력이 약하다는 한계가 있다."},
 {q:"다음 사례에서 나타난 인공지능의 윤리적 문제 유형으로 가장 적절한 것은?",
  box:["한 기업에서 채용 심사를 위해 도입한 인공지능 시스템이 과거 편중된 성별 비율의 학습 데이터를 바탕으로 심사를 진행하여 특정 성별 지원자에게 불리한 평가 점수를 부여하였다."],
  c:["개인 정보 침해","데이터 편향","데이터 무단 사용","데이터 신뢰성 저하","사회적 분열 문제"],a:2,
  e:"편중된 성별 비율의 학습 데이터 때문에 특정 성별에 불리한 판단을 한 것은 데이터 편향 문제이다."}
]},
{ id:"5-1", name:"디지털 사회와 직업", qs:[
 {q:"인간의 지능 능력을 컴퓨터 시스템으로 구현하여 학습, 판단, 추론, 예측하는 첨단 디지털 기술은 무엇인가?",
  c:["클라우드 컴퓨팅","인공지능(AI)","사물 인터넷(IoT)","지리 정보 시스템(GIS)","확장 현실(XR)"],a:2,
  e:"인간의 지능(학습·판단·추론·예측)을 컴퓨터로 구현한 기술은 인공지능(AI)이다."},
 {q:"인터넷 가상 공간에 데이터를 저장하고, 필요할 때마다 컴퓨터나 스마트폰으로 불러와 사용하는 서비스는 무엇인가?",
  c:["빅데이터","블록체인","클라우드 컴퓨팅","사물 인터넷","3D 레이저 스캐닝"],a:3,
  e:"인터넷 가상 공간에 데이터를 저장하고 필요할 때 불러와 쓰는 서비스는 클라우드 컴퓨팅이다."},
 {q:"현실의 이미지에 가상의 정보를 실시간으로 덧붙여 향상된 현실을 보여주는 디지털 기술로 가장 적절한 것은?",
  c:["가상 현실(VR)","증강 현실(AR)","지리 정보 시스템(GIS)","클라우드 컴퓨팅","생체 인식 기술"],a:2,
  e:"현실 이미지에 가상 정보를 실시간으로 덧붙이는 기술은 증강 현실(AR)이다. 가상 현실(VR)은 완전히 가상의 공간을 만든다."},

const NUM = ["①","②","③","④","⑤"];
const KEY = "info2rec";
let REC = {}; try { REC = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(REC)); } catch(e){} };
const qid = (u, i) => `${u}#${i}`;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

let deck = [], pos = 0, title = "", picked = {}; // picked: 이번에 고른 번호

function unitStat(u){
  let ok = 0, no = 0;
  u.qs.forEach((_, i) => { const r = REC[qid(u.id, i)]; if (r === 1) ok++; else if (r === 0) no++; });
  return { ok, no, done: ok + no, total: u.qs.length };
}

function home(){
  document.body.classList.remove("quiz");
  const all = UNITS.reduce((s, u) => { const t = unitStat(u); s.ok += t.ok; s.no += t.no; s.total += t.total; return s; }, {ok:0,no:0,total:0});
  app.innerHTML = `
    <div class="total">
      <div><b>${all.ok + all.no}</b><span>푼 문제 / ${all.total}</span></div>
      <div><b>${all.ok}</b><span>맞힌 문제</span></div>
      <div><b style="color:var(--red)">${all.no}</b><span>틀린 문제</span></div>
    </div>
    ${UNITS.map((u, k) => { const s = unitStat(u);
      const badge = s.done === s.total ? (s.no === 0 ? "🏆" : "✅") : (s.done ? "✏️" : "");
      return `<button class="unit" data-u="${k}">
        <span class="no">${u.id}</span>
        <span class="tx"><div class="nm one">${esc(u.name)}</div>
          <div class="meta">${s.total}문제 · ${s.done ? `맞힘 ${s.ok} · 틀림 ${s.no}` : "아직 안 풀었어요"}</div>
          <div class="bar"><i style="width:${s.done / s.total * 100}%"></i></div></span>
        <span class="badge">${badge}</span></button>`; }).join("")}
    <button class="wrongall" id="wrongAll" ${all.no ? "" : "disabled"}>❌ 틀린 문제만 다시 풀기 (${all.no})</button>
    <button class="reset" id="reset">기록 모두 지우기</button>`;
  app.querySelectorAll(".unit").forEach(b => b.onclick = () => {
    const u = UNITS[b.dataset.u];
    start(u.qs.map((q, i) => ({ u, i, q })), `${u.id} ${u.name}`);
  });
  document.getElementById("wrongAll").onclick = () => {
    const d = []; UNITS.forEach(u => u.qs.forEach((q, i) => { if (REC[qid(u.id, i)] === 0) d.push({ u, i, q }); }));
    start(d, "틀린 문제 다시 풀기");
  };
  document.getElementById("reset").onclick = () => {
    if (confirm("푼 기록을 모두 지울까요?")) { REC = {}; save(); home(); }
  };
  scrollTo(0, 0);
}

function start(d, t){ deck = d; pos = 0; title = t; picked = {}; card(24); }

function card(from){
  if (pos >= deck.length) return finish();
  document.body.classList.add("quiz");
  const { u, i, q } = deck[pos];
  const pick = picked[pos];
  const answered = pick != null;
  const dots = deck.map((_, k) => { const p = picked[k];
    const cls = p == null ? "" : (p === deck[k].q.a ? "ok" : "no"); return `<i class="${cls} ${k === pos ? "cur" : ""}"></i>`; }).join("");
  app.innerHTML = `
    <div class="qtop">
      <button class="back" id="back">← 목록</button>
      <div class="where one">${esc(title)}</div>
      <div class="cnt">${pos + 1} / ${deck.length}</div>
    </div>
    <div class="dots">${deck.length <= 30 ? dots : ""}</div>
    <div class="card ${answered ? "answered" : ""}" id="card" style="--from:${from}px">
      <span class="qno">${u.id} · ${i + 1}번</span>
      <p class="q">${esc(q.q)}</p>
      ${q.box ? `<div class="box">${q.box.map(x => `<div>${esc(x)}</div>`).join("")}</div>` : ""}
      ${q.c.map((c, k) => {
        let cls = "";
        if (answered){ if (k + 1 === q.a) cls = "right"; else if (k + 1 === pick) cls = "wrong"; }
        return `<button class="ch ${cls}" data-k="${k + 1}"><span class="n">${k + 1}</span><span>${esc(c)}</span></button>`; }).join("")}
      <div class="result ${answered ? "show " + (pick === q.a ? "ok" : "no") : ""}" id="res">
        ${answered ? resultHTML(q, pick) : ""}
      </div>
    </div>
    <div class="navrow">
      <button class="prev" id="prev" ${pos ? "" : "disabled"}>←</button>
      <button class="next" id="next" ${answered ? "" : "disabled"}>${pos + 1 < deck.length ? "다음 문제 →" : "결과 보기 🎉"}</button>
    </div>
    <p class="hint">${answered ? "옆으로 밀어도 넘어가요" : "답이라고 생각하는 보기를 눌러 보세요"}</p>`;
  document.getElementById("back").onclick = home;
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  if (!answered) app.querySelectorAll(".ch").forEach(b => b.onclick = () => choose(+b.dataset.k));
  swipe(document.getElementById("card"));
  scrollTo(0, 0);
}

function resultHTML(q, pick){
  const ok = pick === q.a;
  return `<div class="hd">${ok ? "⭕ 정답이에요!" : `❌ 아쉬워요. 정답은 ${NUM[q.a - 1]}`}</div>
    <div class="ex"><b>풀이</b> ${esc(q.e)}</div>`;
}

function choose(k){
  const { u, i, q } = deck[pos];
  picked[pos] = k;
  REC[qid(u.id, i)] = k === q.a ? 1 : 0; save();
  if (navigator.vibrate && k !== q.a) navigator.vibrate(120);
  card(0);
  document.getElementById("card").style.animation = "none";
  const res = document.getElementById("res");
  setTimeout(() => res.scrollIntoView({ behavior: "smooth", block: "center" }), 60);
}

function go(d){
  const n = pos + d;
  if (n < 0) return;
  if (d > 0 && picked[pos] == null) return;
  pos = n; card(d > 0 ? 40 : -40);
}

function swipe(el){
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  });
}

function finish(){
  document.body.classList.remove("quiz");
  const ok = deck.filter((d, k) => picked[k] === d.q.a).length, n = deck.length;
  const wrong = deck.filter((d, k) => picked[k] !== d.q.a);
  const pct = n ? ok / n : 0;
  const face = pct === 1 ? "🏆" : pct >= .8 ? "🎉" : pct >= .5 ? "💪" : "📚";
  const msg = pct === 1 ? "모두 맞혔어요! 완벽해요." : pct >= .8 ? "아주 잘했어요!" : pct >= .5 ? "좋아요, 틀린 것만 한 번 더!" : "풀이를 읽고 다시 도전해 봐요.";
  app.innerHTML = `
    <div class="card done">
      <div class="big">${face}</div>
      <h2 class="jua one">${esc(title)}</h2>
      <div class="score">${ok} / ${n}</div>
      <div class="msg">${msg}</div>
      ${wrong.length ? `<div class="wl"><b>틀린 문제</b>${wrong.map(d => `<div>${d.u.id} · ${d.i + 1}번 — ${esc(d.q.q.slice(0, 40))}${d.q.q.length > 40 ? "…" : ""}</div>`).join("")}</div>` : ""}
      <div class="btns">
        ${wrong.length ? `<button class="b-red" id="again">❌ 틀린 ${wrong.length}문제 다시 풀기</button>` : ""}
        <button class="b-dark" id="retry">처음부터 다시</button>
        <button class="b-plain" id="list">단원 목록으로</button>
      </div>
    </div>`;
  if (wrong.length) document.getElementById("again").onclick = () => start(wrong, title.replace(/ · 다시$/, "") + " · 다시");
  document.getElementById("retry").onclick = () => start(deck, title);
  document.getElementById("list").onclick = home;
  scrollTo(0, 0);
}

home();
</script>
</body>
</html>
